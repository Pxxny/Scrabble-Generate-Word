<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSW24 Word Generator — Zyzzyva Style</title>
<style>
:root{--bg:#0b1020;--panel:#121a2e;--panel2:#18233d;--text:#edf3ff;--muted:#9eabc5;--accent:#72a7ff;--line:#2a395c;--good:#69d39a}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#080d19,#101a31);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:24px}.hero{margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:clamp(26px,4vw,42px)}.hero p{margin:0;color:var(--muted)}
.panel{background:rgba(18,26,46,.94);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.controls{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px}
input,select,button{font:inherit} input,select{width:100%;background:#0d1527;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}
button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--accent);color:#07101f;font-weight:700}
button.secondary{background:#263653;color:var(--text)}button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{margin-top:12px;color:var(--muted);font-size:14px}.status strong{color:var(--good)}
.table-wrap{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px;background:#0e1628}th,td{padding:10px 12px;border-bottom:1px solid #22304e;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#17223a;z-index:1}td.word{font-weight:800;letter-spacing:.06em}td.letters{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#a9c4ff}
.anagrams{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#243554;border:1px solid #344a72;border-radius:999px;padding:4px 8px;font-size:12px}
.empty{color:#687795;font-style:italic}.small{font-size:12px;color:var(--muted)}
@media(max-width:800px){.controls{grid-template-columns:1fr 1fr}}@media(max-width:520px){.controls{grid-template-columns:1fr}.wrap{padding:12px}}
@media print{body{background:white;color:black}.panel{box-shadow:none;border:0}.hero p,.controls,.actions,.status,.small{display:none}.table-wrap{max-height:none;border:0}table{background:white}th{position:static;background:#eee;color:#000}th,td{color:#000;border-color:#bbb}.chip{color:#000;background:white;border-color:#999}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>CSW24 Word Generator</h1>
    <p>เครื่องสุ่มศัพท์จาก CSW24 พร้อม Anagram แบบใช้งานคล้าย Zyzzyva</p>
  </header>

  <section class="panel">
    <div class="controls">
      <label>ความยาวศัพท์ (ตัวอักษร)
        <input id="length" type="number" min="1" max="30" value="7">
      </label>
      <label>จำนวนศัพท์
        <input id="count" type="number" min="1" max="1000" value="50">
      </label>
      <label>การเรียงผลลัพธ์
        <select id="sort">
          <option value="random">สุ่ม</option>
          <option value="alpha">A → Z</option>
          <option value="score">ยาวก่อน</option>
        </select>
      </label>
      <label>แหล่งข้อมูล
        <input id="fileInput" type="file" accept=".txt">
      </label>
    </div>
    <div class="actions">
      <button id="generate">Generate</button>
      <button id="clear" class="secondary">Clear</button>
      <button id="pdf" class="secondary">Export PDF</button>
      <button id="png" class="secondary">Export PNG</button>
      <button id="jpg" class="secondary">Export JPG</button>
    </div>
    <div id="status" class="status">กำลังโหลด CSW24.txt…</div>
  </section>

  <section class="panel">
    <div class="small" id="resultMeta">ยังไม่มีผลลัพธ์</div>
    <div class="table-wrap">
      <table id="results">
        <thead><tr><th>#</th><th>Word</th><th>Letters</th><th>Anagram</th></tr></thead>
        <tbody><tr><td colspan="4" class="empty">กด Generate เพื่อสร้างรายการ</td></tr></tbody>
      </table>
    </div>
  </section>
</div>

<script>
"use strict";
let WORDS = [];
let anagramMap = new Map();
let currentRows = [];

const $ = id => document.getElementById(id);

function normalize(text){
  return [...new Set(text.split(/\r?\n/).map(x=>x.trim().toUpperCase()).filter(x=>/^[A-Z]+$/.test(x)))];
}
function keyOf(w){ return [...w].sort().join(""); }

function buildIndex(){
  anagramMap = new Map();
  for(const w of WORDS){
    const k = keyOf(w);
    if(!anagramMap.has(k)) anagramMap.set(k, []);
    anagramMap.get(k).push(w);
  }
  for(const arr of anagramMap.values()) arr.sort();
}

function setStatus(msg, good=false){
  $("status").innerHTML = good ? "<strong>"+msg+"</strong>" : msg;
}

async function loadDefault(){
  try{
    const r = await fetch("CSW24.txt", {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    WORDS = normalize(await r.text());
    buildIndex();
    setStatus(`โหลด CSW24 สำเร็จ: ${WORDS.length.toLocaleString()} คำ`, true);
  }catch(e){
    setStatus("เปิด CSW24.txt อัตโนมัติไม่ได้ (เช่น เปิด index.html ด้วย file://) — เลือกไฟล์ CSW24.txt ในช่อง “แหล่งข้อมูล” ได้เลย");
  }
}

$("fileInput").addEventListener("change", async e=>{
  const f=e.target.files[0]; if(!f) return;
  WORDS=normalize(await f.text()); buildIndex();
  setStatus(`โหลดไฟล์สำเร็จ: ${WORDS.length.toLocaleString()} คำ`, true);
});

function generate(){
  if(!WORDS.length){setStatus("ยังไม่มี word list — กรุณาโหลด CSW24.txt ก่อน");return;}
  const len=Math.max(1,Math.min(30,+$("length").value||1));
  const count=Math.max(1,Math.min(1000,+$("count").value||1));
  let pool=WORDS.filter(w=>w.length===len);
  if(!pool.length){setStatus(`ไม่พบศัพท์ที่มี ${len} ตัวอักษร`); return;}

  // Fisher-Yates shuffle without mutating the master list.
  pool=[...pool];
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  currentRows=pool.slice(0,Math.min(count,pool.length));
  const mode=$("sort").value;
  if(mode==="alpha") currentRows.sort();
  if(mode==="score") currentRows.sort((a,b)=>b.length-a.length || a.localeCompare(b));

  render();
  setStatus(`สร้าง ${currentRows.length.toLocaleString()} จาก ${pool.length.toLocaleString()} คำที่มี ${len} ตัวอักษร`, true);
}
function render(){
  const tbody=$("results").querySelector("tbody");
  tbody.innerHTML="";
  currentRows.forEach((w,i)=>{
    const tr=document.createElement("tr");
    const ans=(anagramMap.get(keyOf(w))||[]).filter(x=>x!==w);
    tr.innerHTML=`<td>${i+1}</td><td class="word">${w}</td><td class="letters">${keyOf(w)}</td><td class="anagrams">${
      ans.length ? ans.map(x=>`<span class="chip">${x}</span>`).join("") : '<span class="empty">—</span>'
    }</td>`;
    tbody.appendChild(tr);
  });
  $("resultMeta").textContent=currentRows.length ? `ผลลัพธ์ ${currentRows.length} คำ • Letters = ตัวอักษรเรียง A→Z • Anagram ค้นจาก CSW24 ที่โหลดอยู่` : "ยังไม่มีผลลัพธ์";
}
$("generate").onclick=generate;
$("clear").onclick=()=>{currentRows=[];render();setStatus("ล้างผลลัพธ์แล้ว")};

function exportCanvas(ext){
  if(!currentRows.length){setStatus("ยังไม่มีผลลัพธ์ให้ export");return;}
  const scale=2, rowH=48, headH=72, pad=36;
  const width=1200, height=headH+pad+currentRows.length*rowH+pad;
  const c=document.createElement("canvas"); c.width=width*scale; c.height=height*scale;
  const ctx=c.getContext("2d"); ctx.scale(scale,scale);
  ctx.fillStyle="#ffffff";ctx.fillRect(0,0,width,height);
  ctx.fillStyle="#111827";ctx.font="700 30px system-ui";ctx.fillText("CSW24 Word Generator",pad,42);
  ctx.font="14px system-ui";ctx.fillStyle="#4b5563";ctx.fillText(`${currentRows.length} words`,pad,64);
  let y=headH+pad;
  ctx.font="700 15px system-ui";ctx.fillStyle="#111827";
  ctx.fillText("#",pad,y);ctx.fillText("WORD",pad+70,y);ctx.fillText("LETTERS",pad+230,y);ctx.fillText("ANAGRAM",pad+390,y);
  y+=22; ctx.strokeStyle="#cbd5e1";ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(width-pad,y);ctx.stroke(); y+=14;
  ctx.font="700 18px ui-monospace";ctx.fillStyle="#111827";
  currentRows.forEach((w,i)=>{
    ctx.fillText(String(i+1),pad,y+18);
    ctx.fillText(w,pad+70,y+18);ctx.font="14px ui-monospace";ctx.fillStyle="#374151";ctx.fillText(keyOf(w),pad+230,y+18);
    const ans=(anagramMap.get(keyOf(w))||[]).filter(x=>x!==w);
    ctx.font="14px system-ui";ctx.fillStyle="#374151";
    ctx.fillText(ans.length?ans.join(", "):"—",pad+390,y+18);
    ctx.font="700 18px ui-monospace";ctx.fillStyle="#111827";
    y+=rowH;
  });
  const mime=ext==="jpg"?"image/jpeg":"image/png";
  const url=c.toDataURL(mime,0.95);
  const a=document.createElement("a");a.href=url;a.download=`csw24-words-${Date.now()}.${ext}`;a.click();
}
$("png").onclick=()=>exportCanvas("png");
$("jpg").onclick=()=>exportCanvas("jpg");
$("pdf").onclick=()=>{if(!currentRows.length){setStatus("ยังไม่มีผลลัพธ์ให้ export");return;} window.print();};

loadDefault();
</script>
</body>
</html>
